name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: System dependencies (best effort; tests skip without SDL3)
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl3-dev xvfb

      - name: gofmt
        run: |
          out=$(gofmt -l $(find . -name '*.go' -not -path './.git/*'))
          if [ -n "$out" ]; then
            echo "gofmt needed:"
            echo "$out"
            exit 1
          fi

      - name: vet
        run: CGO_ENABLED=0 go vet ./...

      - name: build
        run: CGO_ENABLED=0 go build ./...

      - name: test
        run: |
          if command -v xvfb-run >/dev/null 2>&1; then
            xvfb-run -a env CGO_ENABLED=0 go test ./...
          else
            CGO_ENABLED=0 go test ./...
          fi
